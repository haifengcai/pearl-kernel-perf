name: build-pearl-kernel

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: '内核源码分支'
        type: string
        default: 'android12-5.10-2025-09'
      zstd_upgrade:
        description: '升级内核 zstd 1.4.10 -> 1.5.7（实验性，会关闭 f2fs/squashfs 的 zstd 压缩）'
        type: boolean
        default: false
      jobs:
        description: '并行任务数（留空自动）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      EXPECT_RELEASE: '5.10.240-ztc1997-android12-9-02429-gb280068f4235'
      # scripts/setlocalversion 在 LOCALVERSION 未定义且工作树有改动时会追加 "+"，
      # 这里显式置空（"已定义且为空"）把它压掉，保证 kernel.release 和设备完全一致。
      LOCALVERSION: ''
    steps:
      - name: 检出构建脚本
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
                      /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖与 LLVM 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip rsync cpio \
            xz-utils device-tree-compiler python3 curl git
          # AOSP 的 clang 归档在 CI 上拿不到（返回的是错误页而不是 tar.gz），
          # 改用 apt.llvm.org 的正式版 clang：设备内核是 clang 22.0.1，优先 22，失败回退 21/20。
          curl -sSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          LLVM_VERSION=""
          for v in 22 21 20; do
            echo "== 尝试 clang-$v =="
            if sudo bash /tmp/llvm.sh "$v" && [ -x "/usr/lib/llvm-$v/bin/clang" ]; then
              LLVM_VERSION="$v"
              echo "LLVM_VERSION=$v" >> "$GITHUB_ENV"
              break
            fi
          done
          test -n "$LLVM_VERSION" || { echo "::error::LLVM 安装失败"; exit 1; }
          "/usr/lib/llvm-$LLVM_VERSION/bin/clang" --version
          "/usr/lib/llvm-$LLVM_VERSION/bin/ld.lld" --version

      - name: 增加 swap（LTO 链接吃内存）
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -g

      - name: 拉取内核源码（ztc1997 GKI 5.10）
        run: |
          BRANCH="${{ inputs.base_branch }}"
          [ -z "$BRANCH" ] && BRANCH="android12-5.10-2025-09"
          git clone --depth 1 -b "$BRANCH" \
            https://github.com/ztc1997/android_gki_kernel_5.10_common.git kernel
          cd kernel && git log --oneline -1 && cd ..

      - name: 升级内核 zstd（实验性）
        if: ${{ inputs.zstd_upgrade }}
        run: bash scripts/upgrade_zstd.sh "$PWD/kernel"

      - name: 适配 apt 版 clang（去掉 AOSP 专属 MLGO 标志）
        run: |
          # 树里写死了 -mllvm -regalloc-enable-advisor=release 与 -mllvm -hot-cold-split=true，
          # 这两个依赖 AOSP clang 内置的 ML 模型，普通 LLVM 会直接报
          # "Requested regalloc eviction advisor analysis could not be created"。
          # 去掉后只是少了 ML 指导的寄存器分配，不影响 ABI / vermagic。
          hits=$(grep -rl -e 'regalloc-enable-advisor' -e 'hot-cold-split=true' kernel/ 2>/dev/null || true)
          echo "命中文件: ${hits:-无}"
          for f in $hits; do
            sed -i '/regalloc-enable-advisor=release/d; /hot-cold-split=true/d' "$f"
          done
          if grep -rq -e 'regalloc-enable-advisor=release' kernel/ 2>/dev/null; then
            echo "::error::MLGO 标志没清理干净"; exit 1
          fi
          echo "MLGO 标志已清理"

      - name: 生成 .config（设备原配置 + 性能补丁）
        run: |
          export PATH="/usr/lib/llvm-$LLVM_VERSION/bin:$PATH"
          mkdir -p out
          cp configs/device.config out/.config
          python3 scripts/set_config.py out/.config configs/perf.config
          if [ "${{ inputs.zstd_upgrade }}" = "true" ]; then
            python3 scripts/set_config.py out/.config configs/zstd-upgrade.config
          fi
          make -C kernel O="$PWD/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- olddefconfig
          grep -E '^CONFIG_(TCP_CONG_BBR|DEFAULT_TCP_CONG|NET_SCH_FQ|WERROR|LOCALVERSION)=' out/.config

      - name: 编译内核 Image
        run: |
          export PATH="/usr/lib/llvm-$LLVM_VERSION/bin:$PATH"
          export JOBS="${{ inputs.jobs }}"
          [ -z "$JOBS" ] && JOBS="$(nproc)"
          echo "jobs=$JOBS clang=$(clang --version | head -1)"
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=pearl-ci
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S')"
          time make -C kernel O="$PWD/out" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- -j"$JOBS" Image

      - name: 校验 ABI（vermagic 标志位 + 导出符号 CRC 门禁）
        run: |
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          if [ "$REL" != "$EXPECT_RELEASE" ]; then
            echo "::error::kernel.release 不是设备原串，期望 $EXPECT_RELEASE"
            exit 1
          fi

          # MODVERSIONS 下模块加载时版本号 token 会被跳过，只比较后面的标志位，
          # 所以这里把这几个标志位单独断言一遍——它比版本号更容易被配置改动带偏。
          FLAGS="SMP"
          grep -q '^CONFIG_PREEMPT=y'        out/.config && FLAGS="$FLAGS preempt"
          grep -q '^CONFIG_PREEMPT_VOLUNTARY=y' out/.config && FLAGS="$FLAGS preempt_voluntary"
          grep -q '^CONFIG_MODULE_UNLOAD=y'  out/.config && FLAGS="$FLAGS mod_unload"
          grep -q '^CONFIG_MODVERSIONS=y'    out/.config && FLAGS="$FLAGS modversions"
          FLAGS="$FLAGS aarch64"
          echo "本次 vermagic 标志位: $FLAGS"
          if [ "$FLAGS" != "SMP preempt mod_unload modversions aarch64" ]; then
            echo "::error::vermagic 标志位与 vendor 模块不一致，所有 .ko 都会拒绝加载"
            exit 1
          fi

          # 真正的硬门禁：1340 个导出符号的 CRC 必须和出厂 vendor 模块逐一对上，
          # 否则就是 "disagrees about version of symbol" → 黑屏 / 无限重启。
          SYMVERS=out/Module.symvers
          [ -f "$SYMVERS" ] || SYMVERS=out/vmlinux.symvers
          python3 scripts/check_crc.py "$SYMVERS" refs/vendor_crc.txt
          ls -lh out/arch/arm64/boot/Image

      - name: 打包产物
        run: |
          mkdir -p dist
          REL="$(cat out/include/config/kernel.release)"
          cp out/arch/arm64/boot/Image "dist/Image-$REL"
          cp out/.config "dist/config-${REL}.txt"
          cp out/System.map "dist/System.map-$REL"
          cp out/Module.symvers "dist/Module.symvers-$REL" 2>/dev/null || cp out/vmlinux.symvers "dist/Module.symvers-$REL"
          grep -E '^(Linux version|clang version)' <(strings out/arch/arm64/boot/Image | head -2000) > "dist/build-info.txt" || true
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          zip -9 "kernel-Image.zip" * -x "*.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: dist/*
          if-no-files-found: error
          retention-days: 30
